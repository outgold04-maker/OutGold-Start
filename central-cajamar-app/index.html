return {version:1,demo:true,employees:p,schedules:sc,teams:[{id:id(),date:today,shift:'Branco',title:'BRAVO 01 • demonstração',vtr:'BRAVO 01',base:'Polvilho',period:'07h às 19h',members:first,note:'Dados fictícios para teste.'},{id:id(),date:today,shift:'Azul',title:'BRAVO 02 • demonstração',vtr:'BRAVO 02',base:'Lago Azul',period:'19h às 07h',members:next,note:'Dados fictícios para teste.'}],trades:[],bases:['Central','Polvilho','Lago Azul','Centro','Km 43','Ponunduva','HM','UPA'],vtrs:['ALFA 01','BRAVO 01','BRAVO 02','BRAVO 03','BRAVO 04','BRAVO 05','BRAVO 10','BRAVO 11','UTI 01','UTI 02','VTR 03','VTR 04','VTR 08'],reviewed:{},audit:[],logos:{cajamar:'',samu:''}};}
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')||seed();if(!state||!Array.isArray(state.employees)||!Array.isArray(state.teams))throw 0;}catch{state=seed();}
state.logos??={cajamar:'',samu:''};state.audit??=[];state.bases??=[];state.vtrs??=[];state.reviewed??={};state.trades??=[];state.dailyRoles??={};
let ui={tab:'month',shift:'Todos',month:ds().slice(0,7),day:ds(),sector:'Todos',flyerKind:'day',monthMode:'full',query:''};
function save(action=''){if(action){state.audit.unshift({time:new Date().toLocaleString('pt-BR'),action});state.audit=state.audit.slice(0,100);}if(sync.enabled){if(!canEdit()){toast('Sem permissão para salvar alterações.',true);return}pushShared(structuredClone(state));return;}try{localStorage.setItem(KEY,JSON.stringify(state))}catch(err){toast('Armazenamento cheio. Exporte um backup JSON.',true)}}
function toast(msg,bad=false){const el=$('#toast');el.textContent=msg;el.classList.toggle('bad',bad);el.classList.remove('hide');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hide'),4200)}
function employee(x){return state.employees.find(e=>e.id===x)}
function cell(pid,date){return state.schedules[pid]?.[date]||{type:'',note:''}}
function setCell(pid,date,type,note=''){state.schedules[pid]??={};if(type)state.schedules[pid][date]={type,note};else delete state.schedules[pid][date];}
function selectedPeople(){return state.employees.filter(x=>x.active && (ui.shift==='Todos'||x.shift===ui.shift) && (ui.sector==='Todos'||x.sector===ui.sector) && (!ui.query||x.name.toLocaleLowerCase('pt-BR').includes(ui.query.toLocaleLowerCase('pt-BR')))).sort((a,b)=>SHIFTS.indexOf(a.shift)-SHIFTS.indexOf(b.shift)||SECTORS.indexOf(a.sector)-SECTORS.indexOf(b.sector)||a.name.localeCompare(b.name,'pt-BR'))}
function selectedTeams(){return state.teams.filter(t=>t.date===ui.day&&(ui.shift==='Todos'||t.shift===ui.shift))}
function absentPeople(day=ui.day){return selectedPeople().filter(x=>!['P','EX','TR',''].includes(cell(x.id,day).type))}
function problems(day=ui.day,filterShift=ui.shift){const errors=[],used=new Map(),vehicles=new Map();for(const t of state.teams.filter(t=>t.date===day&&(filterShift==='Todos'||t.shift===filterShift))){if(!t.vtr)errors.push(`${t.title}: VTR não informada`);if(!t.base)errors.push(`${t.title}: base não informada`);if(!t.members.length)errors.push(`${t.title}: nenhum profissional designado`);const vk=t.shift+'|'+t.vtr;if(t.vtr&&vehicles.has(vk))errors.push(`VTR ${t.vtr} repetida no plantão ${t.shift}`);vehicles.set(vk,t.id);for(const memberId of t.members){const e=employee(memberId);if(!e){errors.push('Profissional excluído na '+t.title);continue;}if(used.has(memberId))errors.push(`${e.name} consta em mais de uma equipe`);used.set(memberId,t.id);const c=cell(memberId,day).type;if(c&& !['P','EX','TR'].includes(c))errors.push(`${e.name}: ${TYPE_NAMES[c]} em ${formatDate(day)}, mas designado para VTR`);if(e.shift!==t.shift)errors.push(`${e.name} (${e.shift}) na equipe ${t.shift}: confira troca/extra`);}}
return [...new Set(errors)];}
function numWork(date=ui.day){return selectedPeople().filter(x=>['P','EX','TR'].includes(cell(x.id,date).type)).length}
function render(){
 $('#shiftFilter').value=ui.shift;$('#monthFilter').value=ui.month;$('#dayFilter').value=ui.day;$('#globalSector').value=ui.sector;
 $$('[data-shift]').forEach(b=>{b.classList.toggle('active',b.dataset.shift===ui.shift);b.setAttribute('aria-pressed',String(b.dataset.shift===ui.shift))});
 $$('[data-tab]').forEach(e=>e.classList.toggle('active',e.dataset.tab===ui.tab));
 $('#appMain').innerHTML=({home:renderHome,month:renderMonth,day:renderDay,leaves:renderLeaves,people:renderPeople,trades:renderTrades,fleet:renderFleet,flyers:renderFlyers,settings:renderConfig,config:renderConfig}[ui.tab]||renderMonth)();
 const kp=$('#kpiCards'); if(kp){let a=state.employees.filter(e=>e.active);let counted=SHIFTS.map(sh=>({sh,n:a.filter(p=>p.shift===sh).length}));let fs=a.filter(p=>['F','FE','BH','FD','AT','FA','LI','OU','FC','AB'].includes(cell(p.id,ui.day).type)).length;
 let activeFleet=new Set(state.teams.filter(t=>t.date===ui.day).map(t=>t.vtr)).size;
 kp.innerHTML=`<div class="kpicard"><span class="knumber">${activeFleet}</span><small>🚑 Viaturas</small></div>${counted.map(c=>`<div class="kpicard color-${c.sh.toLowerCase()}"><span class="knumber">${c.n}</span><small>Plantão ${c.sh}</small></div>`).join('')}<div class="kpicard"><span class="knumber">${fs}</span><small>◷ Ausências</small></div><div class="kpicard"><span class="knumber">${state.trades.filter(t=>t.status==='Pendente').length}</span><small>⇄ Trocas</small></div>`;
 let bc=$('#bellCount');if(bc)bc.textContent=String(problems(ui.day,'Todos').length+state.trades.filter(x=>x.status==='Pendente').length);
 }
}
const demoTag=()=>state.demo?'<span class="chip demo">★ DADOS FICTÍCIOS · DEMONSTRAÇÃO</span>':'<span class="chip">● Cadastro personalizado</span>';
function renderHome(){
 const t=selectedTeams(),a=absentPeople(),bad=problems(),n=selectedPeople(),pending=state.trades.filter(x=>x.status==='Pendente').length;
 const shifts=SHIFTS.filter(sh=>ui.shift==='Todos'||sh===ui.shift);

 <div class="statgrid pro-stats"><div class="stat"><div class="i">🚑</div><div class="num">${t.length}</div><div class="lab">Viaturas escaladas</div></div><div class="stat"><div class="i">👥</div><div class="num">${numWork()}</div><div class="lab">Em serviço</div></div><div class="stat"><div class="i">◷</div><div class="num">${a.length}</div><div class="lab">Folgas e ausências</div></div><div class="stat"><div class="i">⇄</div><div class="num">${pending}</div><div class="lab">Trocas pendentes</div></div></div>

 <section class="panel" style="margin-top:16px"><div class="sectionhead"><div><h2>Plantões do dia</h2><p>Cada equipe e viatura aparece apenas no seu plantão</p></div><button class="btn sm primary" data-tab="day">Abrir escala diária</button></div><div class="roster-shifts">${cards}</div></section>
 <div class="hint warning"><b>Modo local / demonstração:</b> os funcionários iniciais são fictícios e as bases/viaturas são referências de modelo, não confirmação operacional. Para uso simultâneo e oficial é necessária uma versão com servidor, autenticação, permissões e homologação.</div>`;

function weekDates(date){const dd=asDate(date);const diff=(dd.getDay()+6)%7;dd.setDate(dd.getDate()-diff);return Array.from({length:7},(_,i)=>{const c=new Date(dd);c.setDate(dd.getDate()+i);return ds(c)});}
function displayStatus(p,date){const c=cell(p.id,date),type=c.type||'',label=type?safeServiceCode(p,type):'+';const color=type==='P'?(label==='N'?'#c6d7fa':'#d8eaff'):STATUS_COLORS[type]||'#f3f6f9';return `<button style="--cell-color:${color}" class="procell ${type?'filled':'blank'} ${type==='FA'?'critical':''}" title="${esc(p.name)} • ${esc(formatDate(date))} • ${esc(TYPE_NAMES[type]||'Não definido')} ${esc(c.note||'')}" data-action="cell" data-pid="${p.id}" data-date="${date}" aria-label="${esc(p.name)}, ${esc(formatDate(date))}: ${esc(TYPE_NAMES[type]||'não definido')}">${esc(label)}</button>`;}
function renderMonth(){
 const dates=ui.monthMode==='week'?weekDates(ui.day):Array.from({length:monthDays(ui.month)},(_,i)=>`${ui.month}-${String(i+1).padStart(2,'0')}`);
 const people=selectedPeople(),shifts=SHIFTS.filter(x=>ui.shift==='Todos'||x===ui.shift);
 const dthead=dates.map(d=>{const wd=asDate(d).getDay();return `<th class="dayhead ${d===ui.day?'selected-day':''} ${wd===0||wd===6?'weekend':''}"><span>${['DOM','SEG','TER','QUA','QUI','SEX','SÁB'][wd]}</span><b>${Number(d.slice(-2))}</b></th>`}).join('');
 const groups=shifts.map(sh=>{const ps=people.filter(p=>p.shift===sh);if(!ps.length)return '';return `<tr class="group-row"><th colspan="${dates.length+2}" class="rs-${sh.toLowerCase()}"><span>PLANTÃO ${esc(sh.toUpperCase())}</span><small>${ps.length} profissionais</small></th></tr>${ps.map((p,i)=>`<tr class="${i%2?'alt':''}"><td class="frozen-name"><b>🚑 ${esc(p.name)}</b><small>${esc(p.sector)} ${p.re?' • RE '+esc(p.re):''}</small></td><td class="rolecol">${esc(p.sector==='Condutor'?'Mot. Amb.':p.sector==='Enfermagem'?'Enfermagem':p.sector)}</td>${dates.map(d=>`<td class="daycell ${d===ui.day?'selected-day':''}">${displayStatus(p,d)}</td>`).join('')}</tr>`).join('')}`}).join('');
 const lg=STATUS.filter(x=>x[0]).map(([code,abbr,label])=>`<div class="legendrow"><span class="statuspill" style="background:${STATUS_COLORS[code]}">${esc(abbr)}</span><span>${esc(label)}</span></div>`).join('');
 const wk=weekDates(ui.day);
 return `<div class="month-shell"><section class="month-board"><div class="sectionhead month-heading"><div><h2>Escala mensal · ${esc(monthName(ui.month))}</h2><p>${people.length} profissionais • toque no dia para registrar folga, banco de horas ou outra ocorrência</p></div><div class="row"><button class="btn sm" data-action="month-mode" data-mode="${ui.monthMode==='full'?'week':'full'}">${ui.monthMode==='full'?'Ver 7 dias':'Ver mês completo'}</button><button class="btn sm primary" data-action="batch-status">＋ Ocorrência</button></div></div>
 ${ui.monthMode==='week'?`<div class="weeknav"><button class="btn sm" data-action="week-back">◀</button><b>${formatDate(wk[0])} a ${formatDate(wk[6])}</b><button class="btn sm" data-action="week-forward">▶</button></div>`:''}
 <div class="pro-table-wrap" id="monthlyGrid"><table class="pro-table ${ui.monthMode==='week'?'weekly':'monthly'}"><thead><tr><th class="sticky-name">VIATURA / PROFISSIONAL</th><th class="rolecol headrole">FUNÇÃO</th>${dthead}</tr></thead><tbody>${groups||`<tr><td colspan="${dates.length+2}" class="empty">Nenhum funcionário corresponde ao filtro.</td></tr>`}</tbody></table></div></section><aside class="legendpanel"><div class="legendhead">ⓘ LEGENDA (CÓDIGOS)</div>${lg}<div class="legendtip">D = diurno e N = noturno conforme plantão. Cores diferentes para cada ocorrência.</div></aside></div>`;
}
function renderDay(){
 const all=selectedTeams().sort((a,b)=>a.vtr.localeCompare(b.vtr,'pt-BR')),issues=problems(ui.day,'Todos'),roles=state.dailyRoles[ui.day]||{};
 return `<section class="daily-page"><div class="daily-banner"><div><span class="eyebrow">ESCALA DIÁRIA DE PLANTÃO</span><h2>${esc(formatDate(ui.day))}</h2><p>Selecione outra data no campo acima</p></div><div class="daily-side"><div class="leaderbox"><b>◈ CONDUTOR LÍDER</b><strong>${esc(roles.leader||'Não definido')}</strong></div><div class="leaderbox"><b>◉ RÁDIO CONTROLE</b><strong>${esc(roles.radio||'Não definido')}</strong></div><button class="btn sm" data-action="edit-roles">✎ Alterar</button></div></div>

function teamCard(t){return `<article class="team pro-team"><div class="team-top"><div>${shiftTag(t.shift)}<h3>${esc(t.title)}</h3></div><div class="row"><button class="btn sm" data-action="edit-team" data-id="${t.id}" title="Editar">✎</button><button class="btn sm red" data-action="delete-team" data-id="${t.id}" title="Excluir">×</button></div></div><div class="team-meta"><em>🚑 ${esc(t.vtr||'VTR não definida')}</em><em>⌖ ${esc(t.base||'Base não definida')}</em><em>◷ ${esc(t.period||'Horário não definido')}</em></div>${t.members.map(pid=>{const p=employee(pid);const status=cell(pid,t.date).type;return p?`<div class="member"><div class="avatar">${esc(p.name.slice(0,2).toUpperCase())}</div><div><strong>${esc(p.name)}</strong><small class="${status&&!['P','EX','TR'].includes(status)?'conflict':''}">${esc(p.sector)}${status&&!['P','EX','TR'].includes(status)?' • '+esc(TYPE_NAMES[status]):''}</small></div></div>`:''}).join('')||'<div class="minitext">Nenhum profissional selecionado.</div>'}${t.note?`<div class="hint" style="margin-top:10px">${esc(t.note)}</div>`:''}</article>`}
function occurrences(){let arr=[];for(let p of selectedPeople())for(let [date,entry] of Object.entries(state.schedules[p.id]||{})){if(!date.startsWith(ui.month)||!entry?.type||entry.type==='P')continue;arr.push({p,date,entry});}return arr.sort((a,b)=>a.date.localeCompare(b.date)||a.p.name.localeCompare(b.p.name,'pt-BR'));}

function renderTrades(){const tr=state.trades.filter(t=>t.dateA.startsWith(ui.month)||t.dateB.startsWith(ui.month));return `<section class="occ-page"><div class="sectionhead"><div><h2>Troca de plantão</h2><p>Solicitações, aprovação, aplicação e histórico em uma tela exclusiva</p></div><button class="btn primary" data-action="new-trade">＋ Nova troca</button></div><div class="trade-grid">${tr.map(t=>`<article class="trade-card"><div class="trade-top"><span class="trade-state ${t.status.toLowerCase()}">${esc(t.status)}</span><span>⇄ ${esc(formatDate(t.dateA))} • ${esc(formatDate(t.dateB))}</span></div><div class="trade-person">${esc(employee(t.a)?.name||'Profissional excluído')}</div><div class="trade-arrow">⇅</div><div class="trade-person">${esc(employee(t.b)?.name||'Profissional excluído')}</div><p>${esc(t.reason||'Sem observação')}</p>${t.status==='Pendente'?`<div class="row"><button class="btn green" data-action="approve-trade" data-id="${t.id}">✓ Aplicar troca</button><button class="btn red" data-action="reject-trade" data-id="${t.id}">Recusar</button></div>`:''}</article>`).join('')||'<div class="empty">Nenhuma troca cadastrada neste mês.</div>'}</div><div class="hint warning">A aplicação atualiza a escala local após verificação. Confirme autorizações conforme as regras da Central.</div></section>`}

function teamModal(t=null){const itm=t||{date:ui.day,shift:ui.shift==='Todos'?'Branco':ui.shift,title:'',vtr:'',base:'',period:'07h às 19h',members:[],note:''};modal(t?'Editar equipe e viatura':'Designar equipe e viatura','Escolha os dados em menus e selecione os profissionais da equipe.',`<form id="teamForm" class="formgrid"><input type="hidden" name="id" value="${esc(t?.id||'')}"><div class="field"><label>Data</label><input type="date" name="date" value="${esc(itm.date)}" required></div><div class="field"><label>Plantão</label>${select('shift',SHIFTS,itm.shift)}</div><div class="field full"><label>Equipe / identificação</label><input name="title" maxlength="70" required placeholder="Ex.: USB 01 / Equipe 01" value="${esc(itm.title)}"></div><div class="field"><label>Viatura</label>${select('vtr',state.vtrs,itm.vtr,'Escolha a viatura')}</div><div class="field"><label>Base</label>${select('base',state.bases,itm.base,'Escolha a base')}</div><div class="field full"><label>Horário do plantão</label><select name="period">${['07h às 19h','19h às 07h','07h às 07h (24h)','08h às 20h','Outro (descrição abaixo)'].map(x=>`<option ${x===itm.period?'selected':''}>${esc(x)}</option>`).join('')}${!['07h às 19h','19h às 07h','07h às 07h (24h)','08h às 20h','Outro (descrição abaixo)'].includes(itm.period)?`<option selected>${esc(itm.period)}</option>`:''}</select></div><div class="field full"><label>Selecione os profissionais</label><div class="person-select" id="memberSelection">${state.employees.filter(x=>x.active).map(x=>`<label class="person-option" data-shift="${esc(x.shift)}"><input type="checkbox" name="members" value="${x.id}" ${itm.members.includes(x.id)?'checked':''}><span><strong>${esc(x.name)}</strong> <small class="minitext">${esc(x.sector)} · ${esc(x.shift)}</small></span></label>`).join('')}</div></div><div class="field full"><label>Observações / horário alternativo</label><input maxlength="180" name="note" placeholder="Ex.: suporte avançado, remanejamento" value="${esc(itm.note||'')}"></div><button type="submit" class="btn primary">✓ Salvar equipe</button></form>`,`<button class="btn" data-action="close-modal">Cancelar</button>`);}
function tradeModal(){modal('Solicitar troca de plantão','A proposta ficará pendente até ser aplicada e conferida.',`<form id="tradeForm" class="formgrid"><div class="field full"><label>Profissional A</label><select name="a" required>${state.employees.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.shift)}</option>`).join('')}</select></div><div class="field"><label>Data que A vai trocar</label><input name="dateA" type="date" value="${ui.day}" required></div><div class="field full"><label>Profissional B</label><select name="b" required>${state.employees.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.shift)}</option>`).join('')}</select></div><div class="field"><label>Data que B vai trocar</label><input name="dateB" type="date" value="${ui.day}" required></div><div class="field full"><label>Motivo / autorização</label><input name="reason" maxlength="120" placeholder="Ex.: permuta entre servidores"></div><div class="hint warning full">Aplicar troca modifica os dois profissionais nas duas datas. Não executa aprovação oficial e não atualiza automaticamente equipes de viaturas.</div><button class="btn primary" type="submit">＋ Registrar solicitação</button></form>`,`<button class="btn" data-action="close-modal">Cancelar</button>`)}
function flyerModal(){modal('Gerar flyer da escala','Arte em PNG: pronta para compartilhar como foto no WhatsApp.',`<form id="flyerForm" class="formgrid"><div class="preview full"><small>VISUALIZAÇÃO DO CONTEÚDO</small><h3>ESCALA CENTRAL DE AMBULÂNCIAS</h3><div class="pills"><span>📅 ${esc(formatDate(ui.day))}</span><span>◈ ${esc(ui.shift)}</span><span>🚑 VTRs e bases</span></div><small class="preview-credit">✦ Tecnologia OutGold</small></div><div class="field full"><label>Tipo de imagem</label><select name="kind"><option value="day" ${ui.flyerKind==='day'?'selected':''}>Escala diária — flyer legível com equipe, base, VTR e liderança</option><option value="week" ${ui.flyerKind==='week'?'selected':''}>Escala semanal — 7 dias com letras grandes (recomendada para WhatsApp)</option><option value="month" ${ui.flyerKind==='month'?'selected':''}>Escala mensal — mês completo (recomendada para impressão e zoom)</option></select></div><div class="field full"><label>Plantão incluído</label><select name="shift"><option value="Todos" ${ui.shift==='Todos'?'selected':''}>Todos os plantões</option>${SHIFTS.map(s=>`<option ${ui.shift===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="hint full">No Android, o sistema tentará enviar a imagem pelo menu de compartilhamento. Se o navegador não permitir, baixará o PNG e abrirá a opção de enviar manualmente no WhatsApp.</div><button type="submit" name="output" value="share" class="btn green">✆ Compartilhar foto</button><button type="submit" name="output" value="download" class="btn primary">↓ Baixar PNG</button></form>`,`<button class="btn" data-action="close-modal">Fechar</button>`)}
function getPersonName(pid){return employee(pid)?.name||'Profissional não encontrado'}
function fileread(file){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(file)})}
async function loadBrandImages(){for(const [key,id,url] of [['cajamar','#cityImage',CITY_URL],['samu','#samuImage',SAMU_URL]]){const el=$(id);el.classList.remove('logo-failed','logo-loaded');el.onload=()=>{el.classList.remove('logo-failed');el.classList.add('logo-loaded')};el.src=state.logos[key]||url;setTimeout(()=>{if(!el.naturalWidth)el.classList.add('logo-failed')},1400)}}
function validateUpload(file){if(!file||!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>1900000){toast('Escolha PNG/JPG/WEBP com até 1,9 MB.',true);return false}return true}
function dateList(from,to){const a=asDate(from),b=asDate(to),out=[];if(b<a)throw new Error('A data final deve ser igual ou posterior à inicial.');const days=Math.round((b-a)/86400000);if(days>366)throw new Error('O intervalo deve ter até 367 dias.');for(let i=0;i<=days;i++){const d=new Date(a);d.setDate(d.getDate()+i);out.push(ds(d))}return out}
function applyTrade(t){const a=employee(t.a),b=employee(t.b);if(!a||!b)return 'Profissional não encontrado.';if(a.id===b.id)return 'A troca precisa ter duas pessoas diferentes.';if(t.dateA===t.dateB)return 'Escolha datas diferentes: a escala diária não comporta permuta no mesmo dia.';
const aA=cell(a.id,t.dateA).type,bB=cell(b.id,t.dateB).type,aB=cell(a.id,t.dateB).type,bA=cell(b.id,t.dateA).type;
if(!['P','EX'].includes(aA)||!['P','EX'].includes(bB))return 'Para troca automática, cada profissional precisa estar marcado em SERVIÇO na sua data original.';
if(!['','F','FC'].includes(aB)||!['','F','FC'].includes(bA))return 'Há indisponibilidade de um profissional na data de destino. Confira férias, atestados ou outros registros.';
for(const [pid,date] of [[a.id,t.dateA],[a.id,t.dateB],[b.id,t.dateA],[b.id,t.dateB]]){if(state.teams.some(team=>team.date===date&&team.members.includes(pid)))return 'Um dos envolvidos está vinculado a uma VTR nas datas da troca. Ajuste primeiro as equipes para evitar inconsistência.';}
setCell(a.id,t.dateA,'F',`Troca com ${b.name}: serviço em ${formatDate(t.dateB)}`);setCell(a.id,t.dateB,'P',`Troca com ${b.name}: originalmente ${formatDate(t.dateA)}`);setCell(b.id,t.dateB,'F',`Troca com ${a.name}: serviço em ${formatDate(t.dateA)}`);setCell(b.id,t.dateA,'P',`Troca com ${a.name}: originalmente ${formatDate(t.dateB)}`);t.status='Aplicada';t.appliedAt=new Date().toLocaleString('pt-BR');return null;}
function updateReviewed(){state.reviewed={}}
function setShiftNav(t){ui.tab=t;render();if(window.innerWidth<750)window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='shiftFilter'){ui.shift=t.value;render();}else if(t.id==='monthFilter'&&/^\d{4}-\d{2}$/.test(t.value)){ui.month=t.value;const newDay=Math.min(Number(ui.day.slice(-2)),monthDays(ui.month));ui.day=`${ui.month}-${String(newDay).padStart(2,'0')}`;render();}else if(t.id==='dayFilter'&&/^\d{4}-\d{2}-\d{2}$/.test(t.value)){ui.day=t.value;ui.month=t.value.slice(0,7);render();}else if(t.id==='sectorFilter'||t.id==='globalSector'){ui.sector=t.value;render();}else if(['cityUpload','samuUpload'].includes(t.id)&&t.files?.length){const key=t.id==='cityUpload'?'cajamar':'samu';if(!validateUpload(t.files[0]))return;try{state.logos[key]=await fileread(t.files[0]);save('Marca original '+key+' carregada localmente');loadBrandImages();toast('Marca carregada: será usada no flyer PNG.')}catch{toast('Não foi possível ler a imagem.',true)}}else if(t.id==='jsonUpload'&&t.files?.length){try{const txt=await t.files[0].text();const incoming=JSON.parse(txt);if(!incoming||!Array.isArray(incoming.employees)||!Array.isArray(incoming.teams)||!incoming.schedules||typeof incoming.schedules!=='object')throw 0;if(!confirm('Substituir todos os dados atuais pelo backup selecionado?'))return;state={...seed(),...incoming};state.demo=!!incoming.demo;save('Backup restaurado');close();loadBrandImages();render();toast('Backup restaurado.')}catch{toast('Arquivo de backup inválido.',true)}}else if(t.id==='csvUpload'&&t.files?.length){try{const txt=(await t.files[0].text()).replace(/^\uFEFF/,'');const rows=txt.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(rows.length<2)throw Error('CSV vazio.');const sep=rows[0].includes(';')?';':',';const headers=rows[0].split(sep).map(x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s/g,''));const ni=headers.indexOf('nome'),si=headers.indexOf('setor'),pi=headers.findIndex(x=>['plantao','corplantao'].includes(x));if(ni<0||si<0||pi<0)throw Error('Cabeçalho deve conter nome;setor;plantao');let count=0;for(const row of rows.slice(1)){const v=row.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));const name=v[ni],sector=SECTORS.find(x=>x.toLowerCase()===String(v[si]||'').toLowerCase()),shift=SHIFTS.find(x=>x.toLowerCase()===String(v[pi]||'').toLowerCase());if(name&&sector&&shift&&!state.employees.some(x=>x.name.toLowerCase()===name.toLowerCase())){state.employees.push({id:id(),name,sector,shift,active:true});count++}}if(!count)throw Error('Nenhum registro novo válido foi encontrado.');save(`${count} funcionários importados de CSV`);close();render();toast(`${count} profissionais importados.`)}catch(err){toast(err.message||'Erro na importação do CSV.',true)}}});

document.addEventListener('click',e=>{const target=e.target.closest('[data-tab],[data-action]');if(!target)return;const tab=target.dataset.tab,act=target.dataset.action;if(tab){setShiftNav(tab);return;}const key=target.dataset.id;switch(act){case 'pick-shift':ui.shift=target.dataset.shift;render();break;case 'month-mode':ui.monthMode=target.dataset.mode==='full'?'full':'week';render();break;case 'week-back':case 'week-forward':{const d=asDate(ui.day);d.setDate(d.getDate()+(act==='week-forward'?7:-7));ui.day=ds(d);ui.month=ui.day.slice(0,7);render();break;}case 'edit-roles':rolesModal();break;case 'close-modal':close();break;case 'new-employee':employeeModal();break;case 'edit-employee':employeeModal(employee(key));break;case 'delete-employee':{const p=employee(key);if(!p||!confirm(`Excluir ${p.name} e suas marcações de escala? A operação não pode ser desfeita sem backup.`))break;state.employees=state.employees.filter(x=>x.id!==key);delete state.schedules[key];state.teams.forEach(x=>x.members=x.members.filter(m=>m!==key));updateReviewed();save('Funcionário removido: '+p.name);render();toast('Profissional removido.');break;}case 'cell':statusModal(target.dataset.pid,target.dataset.date);break;case 'batch-status':bulkModal();break;case 'new-team':teamModal();break;case 'edit-team':teamModal(state.teams.find(x=>x.id===key));break;case 'delete-team':{const t=state.teams.find(x=>x.id===key);if(t&&confirm('Excluir '+t.title+' desta data?')){state.teams=state.teams.filter(x=>x.id!==key);updateReviewed();save('Equipe excluída');render()}break;}case 'new-trade':tradeModal();break;case 'reject-trade':{const t=state.trades.find(x=>x.id===key);if(t&&confirm('Recusar esta solicitação de troca?')){t.status='Recusada';save('Troca recusada');render()}break;}case 'approve-trade':{const t=state.trades.find(x=>x.id===key);if(!t||t.status!=='Pendente')break;const issue=applyTrade(t);if(issue){toast(issue,true);break}updateReviewed();save('Troca aplicada entre '+getPersonName(t.a)+' e '+ const canvasRound=(ctx,x,y,w,h,r=18,fill)=>{ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}};
function canvasText(ctx,text,x,y,size=24,color='#172d42',weight=700,maxWidth){ctx.font=`${weight} ${size}px Arial,sans-serif`;ctx.fillStyle=color;if(maxWidth)ctx.fillText(String(text),x,y,maxWidth);else ctx.fillText(String(text),x,y)}
function fittedText(ctx,value,x,y,maxW,size=27,color='#1a3654',weight=700){let str=String(value);ctx.font=`${weight} ${size}px Arial,sans-serif`;if(ctx.measureText(str).width>maxW){while(str.length>2&&ctx.measureText(str+'…').width>maxW)str=str.slice(0,-1);str+='…'}ctx.fillStyle=color;ctx.fillText(str,x,y)}
function multiWrap(ctx,text,x,y,width,lineHeight=26,maxLines=3){ctx.font='500 19px Arial';let words=String(text).split(/\s+/),line='',n=0;for(const w of words){let tryline=line?line+' '+w:w;if(ctx.measureText(tryline).width>width&&line){canvasText(ctx,line,x,y,19,'#597b94',500);y+=lineHeight;n++;line=w;if(n>=maxLines)return y;}else line=tryline}if(line){canvasText(ctx,line,x,y,19,'#597b94',500);y+=lineHeight}return y}

function contain(ctx,img,x,y,w,h){if(!img)return false;const k=Math.min(w/img.width,h/img.height);const iw=img.width*k,ih=img.height*k;try{ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);return true}catch{return false}}

/* Ações da navegação principal e PWA. */
function shiftMonth(n){let [y,m]=ui.month.split('-').map(Number);let d=new Date(y,m-1+n,1);ui.month=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;ui.day=ui.month+'-01';render()}
function duplicateMonth(){let [y,m]=ui.month.split('-').map(Number),prev=new Date(y,m-2,1),old=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}`;const count=state.employees.reduce((n,p)=>n+Object.keys(state.schedules[p.id]||{}).filter(x=>x.startsWith(old)).length,0);if(!count){toast('O mês anterior não possui marcações para copiar.',true);return}if(!confirm(`Copiar as marcações do mês anterior (${old}) para ${ui.month}? As datas já preenchidas serão mantidas.`))return;let n=0;for(const p of state.employees){for(let d=1;d<=monthDays(ui.month);d++){let dest=ui.month+'-'+String(d).padStart(2,'0'),from=old+'-'+String(Math.min(d,monthDays(old))).padStart(2,'0');if(!cell(p.id,dest).type&&cell(p.id,from).type){setCell(p.id,dest,cell(p.id,from).type,cell(p.id,from).note);n++}}}save('Duplicado mês '+old+' para '+ui.month);render();toast(n+' marcações copiadas. Confira as datas e folgas.')}
function exportCSV(){let rows=[['Plantão','Viatura','RE','Nome','Setor','Registro',...Array.from({length:monthDays(ui.month)},(_,i)=>String(i+1))]];for(const p of state.employees.filter(x=>x.active)){let r=[p.shift,'',p.re||'',p.name,p.sector,p.coren||''];for(let d=1;d<=monthDays(ui.month);d++)r.push(safeServiceCode(p,cell(p.id,ui.month+'-'+String(d).padStart(2,'0')).type)||'');rows.push(r)}const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8;'}),'escala_cajamar_'+ui.month+'.csv');toast('CSV da escala mensal exportado.')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='month-prev')shiftMonth(-1);if(a==='month-next')shiftMonth(1);if(a==='duplicate-month')duplicateMonth();if(a==='print-current')window.print();if(a==='export-csv')exportCSV();if(a==='quick-share'){flyerModal()}if(a==='alerts'){const issues=problems(ui.day,'Todos');const pending=state.trades.filter(t=>t.status==='Pendente');modal('Alertas de escala',formatDate(ui.day),`<div class="mini-list">${issues.map(s=>`<div class="mini-item">⚠ ${esc(s)}</div>`).join('')||'<div class="readybox">Nenhum conflito automático encontrado.</div>'}${pending.map(t=>`<div class="mini-item">⇄ Troca pendente: ${esc(employee(t.a)?.name||'—')} e ${esc(employee(t.b)?.name||'—')}</div>`).join('')}</div>`)}}

// Modo servidor opcional – quando a pasta é servida por server.mjs.
const sync={enabled:false,role:'',version:0,queue:Promise.resolve(),busy:false,loading:false,events:null};
const canEdit=()=>!sync.enabled||['admin','leader'].includes(sync.role);
function syncFooter(){const f=document.querySelector('.main-footer span');if(f)f.textContent=sync.enabled?'Central Cajamar · Base compartilhada · '+(sync.role==='employee'?'Consulta do funcionário':'Gestão de escalas'):'Central Cajamar · Teste local neste aparelho · Sem sincronização';}
async function pullShared(silent=false){if(!sync.enabled||sync.busy||sync.loading)return;sync.loading=true;try{const r=await fetch('/api/state',{credentials:'same-origin',cache:'no-store'});if(r.status===401){showLogin();return}if(!r.ok)throw Error('Falha de leitura');const d=await r.json();if(!silent||d.version!==sync.version){state=d.state;sync.version=d.version;state.audit??=[];state.reviewed??={};state.dailyRoles??={};state.logos??={cajamar:'',samu:''};loadBrandImages();render();syncFooter()}}catch(err){toast('Não foi possível sincronizar: '+err.message,true)}finally{sync.loading=false}}
function pushShared(snapshot){sync.busy=true;sync.queue=sync.queue.then(async()=>{const response=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({version:sync.version,state:snapshot})});const data=await response.json();if(response.status===409){toast('A escala foi alterada em outro aparelho. Recarregando para evitar perda de dados.',true);sync.busy=false;await pullShared();return}if(!response.ok)throw Error(data.error||'Falha na gravação');sync.version=data.version}).catch(err=>{toast('Dados não salvos no servidor: '+err.message,true);sync.busy=false}).finally(()=>{sync.busy=false});return sync.queue;}
function loginScreen(){let bg=document.querySelector('#serverLogin');if(bg)return bg;bg=document.createElement('div');bg.id='serverLogin';bg.innerHTML=`<div class="loginpanel"><div class="loginicon">🚑</div><h1>Central de Ambulâncias de Cajamar</h1><p>Entre para consultar ou organizar sua escala</p><form id="serverLoginForm"><label>E-mail institucional<input name="email" type="email" required autocomplete="username" placeholder="seuemail@exemplo.com"></label><label>Senha<input name="password" type="password" required autocomplete="current-password"></label><button type="submit">Entrar no sistema</button></form><div class="loginerror" role="alert"></div><small>Dados protegidos por usuário e senha no servidor. Tecnologia OutGold.</small></div>`;document.body.appendChild(bg);bg.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,err=bg.querySelector('.loginerror');err.textContent='Verificando acesso...';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({email:f.email.value,password:f.password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Não foi possível entrar');sync.role=d.user.role;bg.remove();await pullShared();connectEvents();syncFooter();toast('Acesso autorizado: '+d.user.name);}catch(e){err.textContent=e.message}});return bg}
function showLogin(){loginScreen().style.display='grid'}
function connectEvents(){if(sync.events){sync.events.close();sync.events=null}if(typeof EventSource!=='undefined'){sync.events=new EventSource('/api/events',{withCredentials:true});sync.events.addEventListener('update',e=>{if(Number(e.data)>sync.version&&!sync.busy)pullShared(true)});}setInterval(()=>{if(!sync.busy)pullShared(true)},30000)}
async function initShared(){if(location.protocol==='file:')return;try{const r=await fetch('/api/health',{cache:'no-store'});if(!r.ok)return;const data=await r.json();if(!data.online)return;sync.enabled=true;const session=await fetch('/api/session',{credentials:'same-origin'});if(session.ok){const d=await session.json();sync.role=d.user.role;await pullShared();connectEvents();syncFooter()}else{showLogin()}}catch(e){console.warn('Modo local ativo.',e.message)}}
function renderAccountsButton(){return sync.role==='admin'?'<button class="btn primary" data-action="manage-users">♟ Gerenciar acessos dos funcionários</button>':''}
async function manageUsers(){if(sync.role!=='admin')return;const r=await fetch('/api/users');if(!r.ok){toast('Não foi possível consultar contas.',true);return}const d=await r.json();modal('Acessos dos funcionários','Administrador, liderança e funcionário com consulta de escala',`<div class="mini-list">${d.users.map(u=>`<div class="mini-item"><div><b>${esc(u.name)}</b><small>${esc(u.email)} • ${esc(u.role)} ${u.active?'':'• INATIVO'}</small></div>${u.active?`<button class="btn sm red" data-action="deactivate-user" data-id="${u.id}">Desativar</button>`:''}</div>`).join('')}</div><form id="createAccountForm" class="formgrid" style="margin-top:15px"><div class="field"><label>Nome</label><input name="name" required minlength="3"></div><div class="field"><label>E-mail</label><input name="email" type="email" required></div><div class="field"><label>Perfil</label><select name="role"><option value="employee">Funcionário (consulta)</option><option value="leader">Liderança (edita escala)</option><option value="admin">Administrador</option></select></div><div class="field"><label>Senha provisória, mínimo 12 caracteres</label><input name="password" type="password" minlength="12" required></div><button class="btn primary" type="submit">＋ Criar acesso</button></form>`);}
document.addEventListener('click',async e=>{let el=e.target.closest('[data-action]');if(!el||!sync.enabled||sync.role!=='admin')return;if(el.dataset.action==='manage-users')await manageUsers();if(el.dataset.action==='deactivate-user'){if(!confirm('Desativar o acesso deste funcionário?'))return;const r=await fetch('/api/users/deactivate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:Number(el.dataset.id)})});toast(r.ok?'Acesso desativado.':'Não foi possível desativar.',!r.ok);if(r.ok)await manageUsers()}});
document.addEventListener('submit',async e=>{if(e.target.id!=='createAccountForm')return;e.preventDefault();let f=e.target,o=Object.fromEntries(new FormData(f));try{let r=await fetch('/api/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});let d=await r.json();if(!r.ok)throw Error(d.error);toast('Acesso cadastrado.');await manageUsers()}catch(err){toast(err.message,true)}});
document.addEventListener('click',e=>{if(!sync.enabled||sync.role!=='employee')return;const b=e.target.closest('[data-action]');if(!b)return;const safe=['month-prev','month-next','month-mode','week-back','week-forward','pick-shift','flyer-modal','quick-share','alerts','print-current'];if(!safe.includes(b.dataset.action)){e.preventDefault();e.stopImmediatePropagation();toast('Seu perfil permite consultar escalas. Alterações são realizadas pela liderança.',true)}},true);

initShared();

loadBrandImages();render();
