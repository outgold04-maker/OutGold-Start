function download(name,data,mime){let u=URL.createObjectURL(new Blob([data],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function action(a){if(a==='expense'||a==='income')form(a);if(a==='agenda'){page='agenda';render()}if(a==='plan'){open('Planejamento do mês','<form class="form" id="planForm"><label>Limite de despesas (R$)<input name="limit" type="number" min="0" step=".01" value="'+(db.limits[month]||0)/100+'"></label><label>Meta de economia (R$)<input name="goal" type="number" min="0" step=".01" value="'+(db.goals[month]||0)/100+'"></label><button class="gold">Salvar</button></form>');$('planForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target);db.limits[month]=Math.round(Number(d.get('limit'))*100);db.goals[month]=Math.round(Number(d.get('goal'))*100);save();close();render()}}if(a==='backup')download('OutGold-Finance-backup-'+today()+'.json',JSON.stringify(db,null,2),'application/json');if(a==='restore')$('import').click();if(a==='csv'){let q=s=>'"'+String(s).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"',dec=v=>(v/100).toFixed(2).replace('.',',');download('OutGold-Finance-'+month+'.csv','\ufeff'+[['Descrição','Tipo','Categoria','Vencimento','Valor','Pago/Recebido','Pendente'],...rows().map(x=>[x.name,x.type==='expense'?'Despesa':'Receita',x.category,x.date,dec(x.cents),dec(x.paid),dec(x.cents-x.paid)])].map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8')}if(a==='print')window.print();if(a==='install'){if(installPrompt){installPrompt.prompt();installPrompt=null}else alert('No Chrome, abra o menu ⋮ e toque em Instalar aplicativo ou Adicionar à tela inicial. No iPhone, use Safari > Compartilhar > Adicionar à Tela de Início.')}} 
$('screen').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.act)action(b.dataset.act);if(b.dataset.detail)detail(b.dataset.detail)};$('screen').onchange=e=>{if(e.target.id==='filter'){filter=e.target.value;render()}};$('screen').oninput=e=>{if(e.target.id==='search'){query=e.target.value;$('accountList').innerHTML=list(rows().filter(x=>(filter==='all'||filter===x.type||filter===x.status||(filter==='pending'&&x.status!=='paid'))&&[x.name,x.category].join(' ').toLowerCase().includes(query.toLowerCase())))}};document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('add').onclick=()=>form();$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};$('prev').onclick=()=>{month=shift(month,-1);render()};$('next').onclick=()=>{month=shift(month,1);render()};$('month').onchange=e=>{if(/^\d{4}-\d{2}$/.test(e.target.value)){month=e.target.value;render()}};$('privacy').onclick=()=>{privateMode=!privateMode;render()};$('import').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!valid(d))throw Error();if(confirm('Substituir os dados atuais pelo backup?')){db=d;save();render()}}catch{alert('Backup inválido ou incompatível.')}e.target.value=''};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
